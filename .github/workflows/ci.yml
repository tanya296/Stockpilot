# Continuous Integration: runs on every push and pull request to main.
# If any job fails, GitHub shows a red cross on the commit.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven            # reuse downloaded dependencies between runs
      - name: Run unit and integration tests
        run: |
          chmod +x mvnw
          ./mvnw -B verify

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check and build
        run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: backend                # only build the image if the tests passed
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t stockpilot-api ./backend
