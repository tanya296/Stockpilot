# StockPilot CI/CD: every push to main is built, tested, packaged as Docker images,
# pushed to Azure Container Registry and rolled out to Azure Kubernetes Service.
# Pull requests only run the build-and-test part (nothing is deployed).
#
# Needed in GitHub -> Settings -> Secrets and variables -> Actions:
#   Secrets:   AZURE_CREDENTIALS (service principal JSON), DB_PASSWORD, JWT_SECRET
#   Variables: ACR_NAME, AKS_RESOURCE_GROUP, AKS_CLUSTER_NAME
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:          # lets you re-run a deploy by hand from the Actions tab

permissions:
  contents: read

env:
  ACR_LOGIN_SERVER: ${{ vars.ACR_NAME }}.azurecr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ---------------------------------------------------------------- 1. Backend
  backend:
    name: Backend - compile, test, package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Compile
        run: |
          chmod +x mvnw            # the execute bit can be lost when committing from Windows
          ./mvnw -B compile

      - name: Run automated tests (JUnit, Mockito, MockMvc + H2)
        run: ./mvnw -B test

      - name: Package the jar
        run: ./mvnw -B package -DskipTests

      - name: Test summary
        if: always()
        run: |
          echo "### Backend tests" >> "$GITHUB_STEP_SUMMARY"
          grep -h "Tests run" target/surefire-reports/*.txt | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/

      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: stockpilot-jar
          path: backend/target/*.jar

  # ---------------------------------------------------------------- 2. Frontend
  frontend:
    name: Frontend - type-check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check and build
        run: npm run build

  # ---------------------------------------------------------------- 3. Images
  images:
    name: Build and push Docker images
    needs: [backend, frontend]                       # only after all tests pass
    if: github.event_name != 'pull_request'          # PRs never publish images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - uses: docker/setup-buildx-action@v3

      # Each image gets two tags: the commit SHA (exact, used for deploying and rolling back)
      # and "latest" (convenience). Layer caching keeps rebuilds fast.
      - name: Build and push the backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/stockpilot-api:${{ env.IMAGE_TAG }}
            ${{ env.ACR_LOGIN_SERVER }}/stockpilot-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push the frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/stockpilot-web:${{ env.IMAGE_TAG }}
            ${{ env.ACR_LOGIN_SERVER }}/stockpilot-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: List the pushed tags
        run: |
          echo "### Images pushed" >> "$GITHUB_STEP_SUMMARY"
          for repo in stockpilot-api stockpilot-web; do
            echo "- \`${ACR_LOGIN_SERVER}/${repo}:${IMAGE_TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          done

  # ---------------------------------------------------------------- 4. Deploy
  deploy:
    name: Deploy to AKS with Ansible
    needs: images
    runs-on: ubuntu-latest
    concurrency: production          # never run two deploys at the same time
    environment:
      name: production
      url: ${{ steps.url.outputs.app_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Connect kubectl to the AKS cluster
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ vars.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ vars.AKS_CLUSTER_NAME }}

      - uses: azure/setup-kubectl@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible and the Kubernetes collection
        run: |
          pip install --quiet ansible-core kubernetes
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Deploy (create secrets, apply manifests, roll out new images, smoke test)
        working-directory: ansible
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: >
          ansible-playbook deploy.yml
          -e api_image=${{ env.ACR_LOGIN_SERVER }}/stockpilot-api:${{ env.IMAGE_TAG }}
          -e web_image=${{ env.ACR_LOGIN_SERVER }}/stockpilot-web:${{ env.IMAGE_TAG }}
          -e git_sha=${{ env.IMAGE_TAG }}

      - name: Verify deployment status
        id: url
        run: |
          kubectl get deployments,statefulsets,pods,services -n stockpilot -o wide
          IP=$(kubectl get svc stockpilot-web -n stockpilot -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          echo "app_url=http://$IP" >> "$GITHUB_OUTPUT"
          {
            echo "### Deployed"
            echo "- URL: http://$IP"
            echo "- Commit: \`${IMAGE_TAG}\`"
            echo '```'
            kubectl get pods -n stockpilot
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          curl -fsS "http://$IP/api/info"
