# Serves the React app and forwards API calls to the Spring Boot backend.
# "stockpilot-api" is the Kubernetes Service name of the backend (Docker Compose uses the same alias),
# so the browser only ever talks to one address and no CORS setup is needed.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API, Swagger UI and the backend health check go to the backend.
    location /api/ {
        proxy_pass http://stockpilot-api:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/(swagger-ui|v3/api-docs|actuator/health) {
        proxy_pass http://stockpilot-api:8090;
        proxy_set_header Host $host;
    }

    # nginx's own health check, used by the Kubernetes probes of the web pod.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Static files built by Vite have a hash in their name, so they can be cached for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Any other path (/products/3, /purchase-orders) is a React route: always return index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
