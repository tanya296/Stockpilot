# Ansible talks to Kubernetes through the API, not over SSH, so the only "host" is the
# machine running the playbook (the GitHub Actions runner, or your laptop). Its kubeconfig
# (set by "az aks get-credentials" / the aks-set-context action) says which cluster to use.
[deployer]
localhost ansible_connection=local ansible_python_interpreter="{{ ansible_playbook_python }}"
