# Deploys StockPilot to Kubernetes (AKS) - idempotent, so running it twice changes nothing.
#
# Run by the pipeline after the images are pushed:
#   ansible-playbook ansible/deploy.yml \
#     -e api_image=<registry>/stockpilot-api:<sha> -e web_image=<registry>/stockpilot-web:<sha> -e git_sha=<sha>
# Secrets come from environment variables (GitHub Actions secrets), never from git:
#   DB_PASSWORD, JWT_SECRET
- name: Deploy StockPilot to Kubernetes
  hosts: deployer
  gather_facts: false

  vars:
    k8s_namespace: stockpilot
    k8s_dir: "{{ playbook_dir }}/../k8s"
    db_user: stockpilot
    db_password: "{{ lookup('ansible.builtin.env', 'DB_PASSWORD') }}"
    jwt_secret: "{{ lookup('ansible.builtin.env', 'JWT_SECRET') }}"
    rollout_timeout: 300s

  tasks:
    - name: Check that the pipeline passed everything we need
      ansible.builtin.assert:
        that:
          - api_image is defined and api_image | length > 0
          - web_image is defined and web_image | length > 0
          - git_sha is defined and git_sha | length > 0
          - db_password | length >= 12
          - jwt_secret | length >= 32
        fail_msg: "Pass api_image, web_image, git_sha and set DB_PASSWORD (12+ chars) and JWT_SECRET (32+ chars)."
        quiet: true

    # ---------------- 1. Namespace and secrets ----------------
    - name: Create the namespace
      kubernetes.core.k8s:
        state: present
        src: "{{ k8s_dir }}/00-namespace.yaml"

    - name: Create or update the secrets
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ item.name }}"
            namespace: "{{ k8s_namespace }}"
          type: Opaque
          stringData: "{{ item.data }}"
      loop:
        - name: stockpilot-db
          data: { username: "{{ db_user }}", password: "{{ db_password }}" }
        - name: stockpilot-app
          data: { jwt-secret: "{{ jwt_secret }}" }
      loop_control:
        label: "{{ item.name }}"
      no_log: true          # never print secret values in the pipeline logs

    # ---------------- 2. Database ----------------
    - name: Apply the PostgreSQL StatefulSet and Service
      kubernetes.core.k8s:
        state: present
        apply: true
        src: "{{ k8s_dir }}/10-postgres.yaml"

    - name: Wait for PostgreSQL to be ready
      ansible.builtin.command: >
        kubectl rollout status statefulset/stockpilot-db -n {{ k8s_namespace }} --timeout={{ rollout_timeout }}
      changed_when: false

    # ---------------- 3. Backend and frontend ----------------
    # The manifests in k8s/ hold placeholder images (":latest") so they stay valid YAML you can
    # apply by hand. Here we swap in the exact images this pipeline run built, and the commit SHA.
    # A new image tag changes the pod template, which makes Kubernetes start a rolling update.
    - name: Apply the API and web Deployments with this build's images
      kubernetes.core.k8s:
        state: present
        apply: true
        definition: >-
          {{ lookup('ansible.builtin.file', k8s_dir ~ '/' ~ item.file)
             | regex_replace(item.placeholder, item.image)
             | regex_replace('value: "local"', 'value: "' ~ git_sha ~ '"')
             | ansible.builtin.from_yaml_all | list }}
      loop:
        - { file: 20-api.yaml, placeholder: 'stockpilotacr\.azurecr\.io/stockpilot-api:latest', image: "{{ api_image }}" }
        - { file: 30-web.yaml, placeholder: 'stockpilotacr\.azurecr\.io/stockpilot-web:latest', image: "{{ web_image }}" }
      loop_control:
        label: "{{ item.file }} -> {{ item.image }}"

    - name: Wait for the rolling updates to finish
      ansible.builtin.command: >
        kubectl rollout status deployment/{{ item }} -n {{ k8s_namespace }} --timeout={{ rollout_timeout }}
      loop: [stockpilot-api, stockpilot-web]
      changed_when: false

    # ---------------- 4. Verify ----------------
    - name: Wait for Azure to give the web Service a public IP
      kubernetes.core.k8s_info:
        kind: Service
        name: stockpilot-web
        namespace: "{{ k8s_namespace }}"
      register: web_svc
      until: web_svc.resources[0].status.loadBalancer.ingress is defined
      retries: 30
      delay: 10

    - name: Remember the public URL
      ansible.builtin.set_fact:
        app_url: "http://{{ web_svc.resources[0].status.loadBalancer.ingress[0].ip }}"

    - name: Smoke test - the site and the API answer, and the API reports this commit
      ansible.builtin.uri:
        url: "{{ app_url }}/api/info"
        return_content: true
      register: info
      until: info.status == 200 and info.json.commit == git_sha
      retries: 18
      delay: 10

    - name: Smoke test - the frontend is served
      ansible.builtin.uri:
        url: "{{ app_url }}/"
        return_content: true
      register: home
      failed_when: home.status != 200 or 'StockPilot' not in home.content

    - name: Show what is running
      ansible.builtin.debug:
        msg:
          - "StockPilot {{ info.json.version }} ({{ info.json.commit[:7] }}) is live at {{ app_url }}"
          - "Release note: {{ info.json.releaseNote }}"
