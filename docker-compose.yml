# Runs StockPilot locally with Docker - the same images the pipeline deploys to Kubernetes.
#   docker compose up -d db        -> only Postgres (use this while developing with mvnw)
#   docker compose up -d --build   -> Postgres + backend + frontend: open http://localhost:8080
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: stockpilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stockpilot"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy   # wait until Postgres actually accepts connections
    environment:
      # Inside Docker's network, containers reach each other by service name ("db"), not localhost.
      DB_URL: jdbc:postgresql://db:5432/stockpilot
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: docker-local-secret-change-me-docker-local-secret
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8090:8090"
    networks:
      default:
        aliases: [stockpilot-api]   # the name nginx in the web image forwards /api to (same as in Kubernetes)

  web:
    build: ./frontend
    depends_on: [api]
    ports:
      - "8080:8080"

volumes:
  pgdata:
