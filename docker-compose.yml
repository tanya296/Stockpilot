# Local Postgres for development: run "docker compose up -d" in the stockpilot folder.
# Matches the defaults in backend/src/main/resources/application.yml.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: stockpilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
