spring:
  application:
    name: stockpilot
  datasource:
    # Values come from environment variables so secrets never live in git.
    # Locally you set them in your run config; on Cloud Run they are service env vars.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stockpilot}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate only checks that entities match the tables.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        # Load lazy collections for up to 50 parents in one "WHERE id IN (...)" query,
        # instead of one query per parent (fixes N+1 for purchase-order items).
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    # Must be at least 32 characters (256 bits) for HS256.
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}

server:
  port: ${PORT:8090}
