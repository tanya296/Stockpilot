# Test config: an in-memory H2 database in PostgreSQL compatibility mode.
# Every test run starts from a clean database; Flyway runs the same migrations as production.
spring:
  datasource:
    url: jdbc:h2:mem:stockpilot;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

app:
  seed:
    enabled: false
  jwt:
    secret: test-secret-test-secret-test-secret-test-secret
    expiration-minutes: 60
  cors:
    allowed-origins: http://localhost:5173
